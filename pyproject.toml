[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certiq"
version = "1.0.0"
description = "CertIQ — Enterprise Certification Intelligence Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "CertIQ Team"},
]
keywords = [
    "certification",
    "ai-agents",
    "multi-agent",
    "azure",
    "enterprise-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "openai>=1.40.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "azure-search-documents>=11.6.0",
    "azure-storage-blob>=12.20.0",
    "azure-identity>=1.17.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]
eval = [
    "azure-ai-evaluation>=1.0.0",
]

[project.scripts]
certiq-api = "api.main:start"
certiq-setup-kb = "scripts.setup_knowledge_base:main"
certiq-demo = "scripts.demo_scenario:main"
certiq-eval = "scripts.run_evaluations:main"

[tool.setuptools.packages.find]
include = ["agents*", "integrations*", "reasoning*", "api*", "observability*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
